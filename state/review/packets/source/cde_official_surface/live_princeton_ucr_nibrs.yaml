        - strong [ref=e89]: Scope
        - text: ": Periodic nationwide assessments of reported crimes. The UCR program was subsequently expanded to capture incident-level data with the implementation of the"
        - link "National Incident-Based Reporting System" [ref=e90] [cursor=pointer]:
          - /url: https://dss.princeton.edu/resources/482
        - text: . The
        - link "NIBRS" [ref=e91] [cursor=pointer]:
          - /url: https://dss.princeton.edu/resources/482
        - text: data focus on various aspects of a crime incident. Gathering of hate crime data by the UCR program was began in 1990. Hate crimes are defined as crimes that manifest evidence of prejudice based on race, religion, sexual orientation, or ethnicity. In September 1994, disabilities, both physical and mental, were added to the list. Also see
        - link "Missing Data in the Uniform Crime Reports, 1977-2000" [ref=e92] [cursor=pointer]:
          - /url: https://www.icpsr.umich.edu/web/ICPSR/studies/32061
        - text: . Select data is also contained in
        - link "Sage Data" [ref=e93] [cursor=pointer]:
          - /url: https://libguides.princeton.edu/resource/4899
        - text: .
        - link "1930-1959" [ref=e94] [cursor=pointer]:
          - /url: https://www.icpsr.umich.edu/web/ICPSR/studies/3666
        - text: are available as scans of the books.
        - strong [ref=e95]: Where is the documentation
        - text: ":"
        - link "ICPSR site" [ref=e96] [cursor=pointer]:
          - /url: https://www.icpsr.umich.edu/web/ICPSR/series/57
        - strong [ref=e97]: "Sample Size:"
        - text: Over 4,500 agencies reporting since 1998.
        - strong [ref=e98]: "Unit of Analysis:"
      - list [ref=e99]:
        - listitem [ref=e100]:
          - strong [ref=e101]: Agency-Level UCR Data
      - paragraph [ref=e102]:
        - text: The
        - strong [ref=e103]: agency-level
        - text: "data, where the unit of analysis is the police agency (or incident for Supplementary Homicide Reports and Hate Crime) and contain information on:"
      - list [ref=e104]:
        - listitem [ref=e105]:
          - strong [ref=e106]: Offenses known and clearances by arrest
        - listitem [ref=e107]:
          - strong [ref=e108]: Property stolen and recovered.
          - text: Aggregated at the agency-level, report on the nature of the crime, the monetary value of the property stolen, and the type of property stolen.
        - listitem [ref=e109]:
          - strong [ref=e110]: Supplementary Homicide Reports (SHR)
          - text: provide incident-based information on criminal homicides. Contain information describing the victim(s) of the homicide, the offender(s), the relationship between victim and offender, the weapon used, and the circumstance of the incident.
        - listitem [ref=e111]:
          - strong [ref=e112]: Police Employee (LEOKA) Data
          - text: provide information about Law Enforcement Officers Killed or Assaulted in the line of duty. Provide in-depth information on the circumstances surrounding killings or assaults, including type of call answered, type of weapon used, and type of patrol the officers were on.
        - listitem [ref=e113]:
          - strong [ref=e114]: Hate Crime Data
          - text: includes number of victims and offenders involved in each hate crime incident, type of victims, bias motivation, offense type, and location type.
        - listitem [ref=e115]:
          - strong [ref=e116]: Arrests by age, sex, and race
        - listitem [ref=e117]:
          - strong [ref=e118]: Arson
      - list [ref=e119]:
        - listitem [ref=e120]:
          - strong [ref=e121]: Incident-Level UCR Data
      - paragraph [ref=e122]:
        - strong [ref=e123]: Incident-level
        - text: data are collected through the
        - link "National Incident-Based Reporting System (NIBRS)" [ref=e124] [cursor=pointer]:
          - /url: http://www.icpsr.umich.edu/icpsrweb/ICPSR/series/128
        - text: component of the UCR.
        - link "NIBRS" [ref=e125] [cursor=pointer]:
          - /url: http://www.icpsr.umich.edu/icpsrweb/ICPSR/series/128
        - text: collects data on each single incident and arrest within 24 offense categories made up of 52 specific crimes called Group A offenses. For each of the offenses coming to the attention of law enforcement, specified types of facts about each crime are collected. In addition to the Group A offenses, there are 10 Group B offense categories for which only arrest data are reported. More information about this study can be found in the
        - link "NIBRS Resource Guide" [ref=e126] [cursor=pointer]:
          - /url: https://www.icpsr.umich.edu/web/pages/NACJD/NIBRS/index.html
        - text: . Beginning in January, 2021, the FBI’s National Incident-Based Reporting System (NIBRS) became the national standard for law enforcement crime data reporting in the United States. The transition to NIBRS represented a significant improvement in how reported crime is measured and estimated by the federal government.
      - paragraph [ref=e127]: As of May 2024—
      - list [ref=e128]:
        - listitem [ref=e129]: all 50 U.S. states and the District of Columbia are certified to report crime data to NIBRS
        - listitem [ref=e130]: 82% of the U.S. population is covered by NIBRS-reporting law enforcement agencies
        - listitem [ref=e131]: 125 of the 154 police agencies serving cities and counties with a population of 250,000 or more are reporting to NIBRS, covering a total population of more than 76.7 million persons.
      - paragraph [ref=e132]:
        - text: See
        - link "coverage map" [ref=e133] [cursor=pointer]:
          - /url: https://bjs.ojp.gov/national-incident-based-reporting-system-nibrs#0-0
        - text: .
      - paragraph [ref=e134]:
        - strong [ref=e135]: County-Level UCR Data
      - paragraph [ref=e136]:
        - text: Note UCR County Codes are different than FIPS codes. To convert use the
        - generic [ref=e138]:
          - link "Law Enforcement Agency Identifiers Crosswalk" [ref=e139] [cursor=pointer]:
            - /url: https://www.icpsr.umich.edu/web/NACJD/studies/35158/variables?q=county
          - text: .
        - text: The
        - strong [ref=e140]: county-level
        - text: "Uniform Crime Reporting files contain only arrests and crimes reported data and are distributed annually as 4 separate data files:"
      - list [ref=e141]:
        - listitem [ref=e142]: Arrests, All Ages
        - listitem [ref=e143]: Arrests, Adults
        - listitem [ref=e144]: Arrests, Juveniles
        - listitem [ref=e145]: Crimes Reported
      - paragraph [ref=e146]: Beginning in 1993, an Allocated Statewide Data file is also distributed for each part above. The Statewide data files provide the amount of data from statewide agencies allocated to each county based on the county's share of the state population. These Statewide data files can also be used to "back out" the statewide counts if only the county total is desired.
