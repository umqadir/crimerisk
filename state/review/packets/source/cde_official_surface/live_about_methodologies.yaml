        - generic [ref=e127]:
          - generic [ref=e128]: Crime Data
          - generic [ref=e131]:
            - generic [ref=e132]:
              - paragraph [ref=e133]:
                - text: Since 1930, participating law enforcement agencies have voluntarily provided the nation with crime statistics through the
                - link "Uniform Crime Reporting (UCR) Program." [ref=e134] [cursor=pointer]:
                  - /url: https://ucr.fbi.gov/
                - img [ref=e136]
              - paragraph [ref=e142]: By recommendation of the FBI's Criminal Justice Information Services Advisory Policy Board and with the support of the nation's major law enforcement organizations, the Uniform Crime Reporting (UCR) Program retired its long-time Summary Reporting System (SRS) and began accepting crime data exclusively via the National Incident-Based Reporting System (NIBRS)–a much more comprehensive data collection system–on January 1, 2021. Incident-based data allow us to visualize details regarding individual offenses and arrests that were part of an incident, such as information about the victim, offender, property involved, and arrestees, providing context that is not provided by the summary data.
              - paragraph [ref=e143]: For the 2022 data year, to provide nationally representative data, the FBI accepted Summary Reporting System data submissions from non-transitioned agencies. This interim measure will ensure more complete data as agencies continue to transition to NIBRS.
              - paragraph [ref=e144]:
                - text: The Crime Data Explorer makes this data available through the
                - link "API" [ref=e145] [cursor=pointer]:
                  - /url: "#/pages/docApi"
                - text: and
                - link "bulk downloads." [ref=e146] [cursor=pointer]:
                  - /url: "#/pages/downloads"
            - generic [ref=e149]:
              - generic [ref=e150]: UCR Program Resources
              - generic [ref=e153]:
                - link "UCR Home" [ref=e155] [cursor=pointer]:
