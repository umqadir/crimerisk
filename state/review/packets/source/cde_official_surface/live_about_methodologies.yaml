        - generic [ref=e184]:
          - generic [ref=e185]: Methodologies Explain Potential Differences in UCR Data
          - generic [ref=e187]:
            - paragraph [ref=e188]:
              - text: The Uniform Crime Reporting (UCR) Program has migrated its data releases from static web publications hosted on
              - link "fbi.gov" [ref=e189] [cursor=pointer]:
                - /url: https://www.fbi.gov/
              - img [ref=e191]
              - text: to more dynamic, multi-year displays of data on the Crime Data Explorer (CDE). Just as the data in the tables of the annual publications sometimes differed from those available in the master files for the same year, the data in the tables of the various releases may also differ from those on the Explorer Pages of the CDE. These variations are due to the difference in methodologies between the tables and data displayed on the CDE. Historically, the agency, state, regional, and national data in the NIBRS (i.e., National Incident-Based Reporting System), Crime in the United States, Hate Crime Statistics, and Law Enforcement Officers Killed and Assaulted releases must pass internal data quality reviews prior to publication. According to the methodology, data that do not meet established criteria are not included.
            - paragraph [ref=e197]: As is the case with all the master files released for 1960 through 2019, the data displayed on the CDE include all reported data from agencies and entities aggregated from the agency data, such as states. According to methodology of typical open data websites, all reported data remain in file. Individuals who typically work with data files, such as master files, can also access the CDE releases of data for 2019 and earlier for data based on the same methodology.
            - paragraph [ref=e198]:
              - text: Individuals who typically use data from tables in Crime in the United States and other UCR web publications on
              - link "fbi.gov" [ref=e199] [cursor=pointer]:
                - /url: https://www.fbi.gov/
              - img [ref=e201]
              - text: will continue to have access to that format via the downloadable publication tables for 2019 and prior years on that site.
