        - generic [ref=e83]:
          - generic [ref=e84]: About the Crime Data Explorer
          - generic [ref=e87]:
            - generic [ref=e88]:
              - paragraph [ref=e89]:
                - text: The Crime Data Explorer (CDE) is the FBI’s
                - link "Uniform Crime Reporting (UCR) Program's" [ref=e90] [cursor=pointer]:
                  - /url: https://ucr.fbi.gov/
                - img [ref=e92]
                - text: dynamic solution to presenting crime data in a more immediate venue that reflects the constant change in the nation’s crime circumstance.
              - paragraph [ref=e98]:
                - text: The CDE pages provide a view of estimated national and state data, reported agency-level crime statistics, and graphs of specific variables from the National Incident-Based Reporting System (NIBRS). You can also
                - link "download bulk datasets" [ref=e99] [cursor=pointer]:
                  - /url: "#/pages/downloads"
                - text: from a variety of UCR topics. In addition, the
                - link "Crime Data API" [ref=e100] [cursor=pointer]:
                  - /url: "#/pages/docApi"
                - text: (application programming interface) provides a way for developers to access and share large amounts of data in significant ways.
              - paragraph [ref=e101]:
                - text: The Crime Data Explorer is part of the FBI’s broader effort to modernize the reporting of national crime data. It allows you to
                - link "view trends" [ref=e102] [cursor=pointer]:
                  - /url: "#/pages/explorer/crime/crime-trend"
                - text: ","
                - link "download bulk data" [ref=e103] [cursor=pointer]:
                  - /url: "#/pages/downloads"
                - text: ", and access the Crime Data API for reported crime at the national, state, and agency levels."
            - generic [ref=e106]:
