[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crimerisk"
version = "0.1.0"
description = "Open-source replication of an AGS CrimeRisk-style index (2025B mechanics)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "altair>=6.0.0",
    "duckdb>=1.4.3",
    "fiona>=1.10.1",
    "geopandas>=1.1.3",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5,<2.4.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "pygam>=0.12.0",
    "pyogrio>=0.12.1",
    "pypdf>=6.5.0",
    "pyshp>=3.0.3",
    "pyyaml>=6.0.3",
    "rasterio>=1.4.4",
    "rasterstats>=0.20.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.16.3",
    "shapely>=2.1.2",
    "streamlit>=1.52.2",
    "tqdm>=4.67.1",
    "xlrd>=2.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
