<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CrimeRisk - 2024 block groups</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0e14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #e6e9ef; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; top: 14px; left: 14px; width: 296px; background: rgba(16,20,28,0.94); border: 1px solid #232a36; border-radius: 10px; padding: 14px 16px; box-shadow: 0 8px 28px rgba(0,0,0,0.45); z-index: 5; max-height: calc(100% - 28px); overflow-y: auto; }
  .panel h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: .2px; }
  .panel .sub { font-size: 11px; color: #8a93a6; margin: 0 0 12px; line-height: 1.4; }
  label.fld { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: #8a93a6; margin: 0 0 5px; }
  select { width: 100%; background: #0f1622; color: #e6e9ef; border: 1px solid #2a3342; border-radius: 7px; padding: 7px 9px; font-size: 13px; }
  .explain { font-size: 11px; color: #aab2c2; line-height: 1.5; margin: 10px 0 0; padding: 8px 10px; background: rgba(255,255,255,0.03); border: 1px solid #232a36; border-radius: 7px; }
  .explain b { color: #e6e9ef; font-weight: 600; }
  .toggle { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: #c2c9d6; cursor: pointer; user-select: none; }
  .toggle input { accent-color: #ef8a62; width: 14px; height: 14px; cursor: pointer; }
  .legend { margin-top: 14px; }
  .legend .bar { height: 10px; border-radius: 5px; }
  .legend .bar.index { background: linear-gradient(90deg, #2166ac, #67a9cf, #d1e5f0, #f7f7f7, #fddbc7, #ef8a62, #b2182b); }
  .legend .bar.density { background: linear-gradient(90deg, #0d2818, #14532d, #3f8f4e, #a3d977, #fde047, #f97316, #b91c1c); }
  .legend .ticks { display: flex; justify-content: space-between; font-size: 10px; color: #8a93a6; margin-top: 4px; }
  .legend .note { font-size: 10px; color: #8a93a6; margin-top: 8px; line-height: 1.4; }
  .legend .key { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
  .legend .nodata { background: #3a4150; border: 1px solid #4a5365; }
  .legend .special { background: repeating-linear-gradient(45deg, #5a4632 0 3px, #2a2018 3px 6px); border: 1px solid #6b5337; }
  .disclaimer { margin-top: 13px; padding-top: 11px; border-top: 1px solid #232a36; font-size: 10.5px; color: #9aa3b4; line-height: 1.5; }
  .disclaimer .t { color: #c2c9d6; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; font-size: 9.5px; display: block; margin-bottom: 4px; }
  .maplibregl-popup-content { background: #10141c; color: #e6e9ef; border: 1px solid #2a3342; border-radius: 9px; padding: 11px 13px; font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5); max-width: 290px; }
  .maplibregl-popup-tip { border-top-color: #10141c !important; border-bottom-color: #10141c !important; }
  .pp-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .pp-sub { color: #8a93a6; font-size: 11px; margin-bottom: 8px; }
  .pp-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #232a36; }
  .pp-head .v { font-size: 20px; font-weight: 700; }
  .pp-badge { display: inline-block; background: #5a4632; color: #f0d9b5; border: 1px solid #6b5337; border-radius: 4px; padding: 1px 6px; font-size: 10px; font-weight: 600; margin-bottom: 8px; }
  .pp-grid { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  .pp-grid .k { color: #9aa3b4; }
  .pp-grid .v { text-align: right; font-variant-numeric: tabular-nums; }
  .pp-nd { color: #8a93a6; font-style: italic; }
  .pp-note { margin: 7px 0 8px; color: #c2c9d6; font-size: 10.5px; line-height: 1.4; }
  .pp-foot { margin-top: 8px; padding-top: 7px; border-top: 1px solid #232a36; color: #8a93a6; font-size: 10.5px; line-height: 1.4; }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>CrimeRisk</h1>
  <p class="sub" id="meta">Loading 2024 block groups...</p>
  <label class="fld" for="crime-sel">Crime type</label>
  <select id="crime-sel"></select>
  <label class="fld" for="measure-sel" style="margin-top:11px">Measure <span style="text-transform:none;letter-spacing:0;color:#6f7889">(what the number means)</span></label>
  <select id="measure-sel"></select>
  <div id="alt-wrap" style="display:none">
    <label class="fld" for="alt-sel" style="margin-top:11px">Other total views</label>
    <select id="alt-sel"></select>
  </div>
  <p class="explain" id="measure-explain"></p>
  <label class="toggle" for="su-toggle" title="Airports, parks, and large commercial or institutional areas can make per-person rates misleading. Off: shown as muted special areas. On: show counts and density.">
    <input type="checkbox" id="su-toggle" />
    Include special-use areas
  </label>
  <div class="legend">
    <div class="bar index" id="legend-bar"></div>
    <div class="ticks"><span id="t-lo">-</span><span id="t-mid">100</span><span id="t-hi">-</span></div>
    <div class="note" id="legend-note"></div>
  </div>
  <div class="disclaimer" id="disclaimer"><span class="t">Methodology</span><span id="disclaimer-body"></span></div>
</div>
<script>
const SOURCE = "blockgroups";
const LAYER_ID = "bg-fill";
const SPECIAL_LAYER_ID = "bg-special";

let SNAP = null;          // snapshot.json
let STATS = null;         // per-key color stats
let CURRENT = null;       // current layer key
let INCLUDE_SU = false;   // "Include special-use areas" toggle state
const ATTRIBUTION = "&copy; CARTO &copy; OpenStreetMap &middot; Crime data: FBI Crime Data Explorer &amp; state/city public records";

// Register the pmtiles protocol so MapLibre can read tiles from the archive.
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      basemap: {
        type: "raster",
        tiles: ["https://basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png"],
        tileSize: 256,
        attribution: ATTRIBUTION,
      },
    },
    layers: [{ id: "bg", type: "raster", source: "basemap" }],
  },
  center: [-96, 38],
  zoom: 4,
  maxZoom: 12,
  minZoom: 3,
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

// --- helpers --------------------------------------------------------------
function defByKey(key) { return SNAP.indices.find(i => i.key === key); }
function isDensity(key) { const d = defByKey(key); return d && d.kind === "density"; }

// The em_* tile key (per-offense estimate-mode code) for the active layer, or
// null for aggregate layers (which use the block-group `su` flag instead).
function emodeKeyFor(key) { return SNAP.layer_emode_key[key] || null; }

// Is a feature's properties special-use FOR THE ACTIVE LAYER?
// Offense layers: per-offense estimate-mode code is special_use(2) or
// vehicle_denominator_invalid(3). Aggregate/total layers: block-group su flag.
function isSpecialUse(p, key) {
  const ek = emodeKeyFor(key);
  if (ek) { const c = p[ek]; return c === 2 || c === 3; }
  return +p[SNAP.special_use_flag_key] === 1;
}

// ---- color expressions ---------------------------------------------------
// INDEX layers use a ROBUST QUANTILE (equal-count) scale. The index is heavily
// right-skewed — most cells sit well below the national average while a thin urban
// tail and a few tiny-population cells run into the thousands — so any LINEAR ramp
// (even one clipped at a cap) crushed the low-end majority into one flat color and
// let outliers dominate. Instead we place the color stops at the value of each
// population percentile (`q`, precomputed in 01: p2,p10,p20..p90,p95,p98). Each
// color band then holds ~the same number of cells, so the full spatial gradient is
// visible everywhere; extreme outliers simply land in the saturated top band.
//
// The colorway stays diverging blue -> white -> red so "above / below the national
// average (100)" still reads: the quantile band whose range straddles 100 gets the
// neutral white anchor, bands below it shade blue, bands above shade red. Above the
// top quantile stop the value clamps to the deepest red (honest ">= top" in legend).
const INDEX_RAMP = ["#2166ac","#4393c3","#92c5de","#d1e5f0","#f7f7f7","#fddbc7","#f4a582","#d6604d","#b2182b"];

// Build evenly-spaced ramp colors anchored so the white midpoint lands at the band
// straddling 100. Returns {stops:[[value,color],...]} for an `interpolate` expr.
function buildQuantileStops(q) {
  const n = q.length;
  // Index of the first stop >= 100 (the "above average" boundary); the band just
  // below it straddles 100 and takes the neutral white.
  let pivot = q.findIndex(v => v >= 100);
  if (pivot < 0) pivot = n;                 // whole distribution below 100
  // Fraction of the colorway (0..1) assigned to each quantile stop: spread the
  // below-100 stops across the blue half [0,0.5], the rest across the red half.
  const ramp = INDEX_RAMP;
  const colorAt = t => {                    // t in [0,1] -> interpolated ramp color
    const x = Math.max(0, Math.min(1, t)) * (ramp.length - 1);
    const i = Math.floor(x), f = x - i;
    if (i >= ramp.length - 1) return ramp[ramp.length - 1];
    return lerpHex(ramp[i], ramp[i + 1], f);
  };
  const stops = [];
  for (let i = 0; i < n; i++) {
    // Map stop i to colorway position: below-pivot stops fill [0,0.5),
    // pivot..end fill [0.5,1]. Guards against a degenerate pivot at the ends.
    let t;
    if (pivot <= 0) t = 0.5 + 0.5 * (i / Math.max(1, n - 1));
    else if (pivot >= n) t = 0.5 * (i / Math.max(1, n - 1));
    else if (i < pivot) t = 0.5 * (i / pivot);
    else t = 0.5 + 0.5 * ((i - pivot + 1) / (n - pivot));
    stops.push([q[i], colorAt(t)]);
  }
  return stops;
}

// Linear interpolate between two #rrggbb hex colors.
function lerpHex(a, b, f) {
  const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
  const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
  const c = pa.map((v,i) => Math.round(v + (pb[i]-v)*f));
  return "#" + c.map(v => v.toString(16).padStart(2,"0")).join("");
}

function indexColorExpr(key) {
  const s = STATS[key];
  // Quantile stops; fall back to a coarse linear ramp if `q` is absent (older snap).
  const q = (s.q && s.q.length >= 2) ? s.q
          : [s.p01, 100, (s.p98 || s.p99 || 200)].filter((v,i,a) => i===0 || v>a[i-1]);
  const stops = buildQuantileStops(q);
  const expr = ["interpolate", ["linear"], ["to-number", ["get", key]]];
  // Pin the bottom so values below the first quantile stop don't extrapolate.
  if (stops[0][0] > s.min) expr.push(s.min, stops[0][1]);
  stops.forEach(([v, c]) => expr.push(v, c));
  return expr;
}

// DENSITY layers: sequential, heavily right-skewed (incidents/sq mi). Interpolate
// in LOG space so genuine hotspots stand out instead of the whole map being one
// color. Stops are the log of the per-key positive-value quantiles.
function densityColorExpr(key) {
  const s = STATS[key];
  const L = v => Math.log10(Math.max(v, 0.01));
  return [
    "interpolate", ["linear"], ["log10", ["max", ["to-number", ["get", key]], 0.01]],
    L(s.p10), "#0d2818",
    L(s.p50), "#3f8f4e",
    L(s.p90), "#fde047",
    L(s.p99), "#f97316",
    L(s.max), "#b91c1c",
  ];
}

// Full paint color for the MAIN fill layer: no-data grey when the active value is
// absent; special-area handling is delegated to a separate hatched layer drawn on
// top, but the main layer also greys special-use cells so they never show as a
// screaming per-capita outlier or a misleading color.
function colorExpr(key) {
  const ramp = isDensity(key) ? densityColorExpr(key) : indexColorExpr(key);
  return ["case", ["!", ["has", key]], "#3a4150", ramp];
}

// ---- reliability metadata -------------------------------------------------
const OPACITY_FULL = 0.82;

// The rt_* tile key whose reliability tier de-emphasizes the active layer, or null
// (density / unmapped layers -> uniform full opacity, no count-noise problem).
function reliabilityKeyFor(key) {
  return (SNAP.layer_reliability_key && SNAP.layer_reliability_key[key]) || null;
}

function opacityExpr(key) {
  return OPACITY_FULL;
}

// Filter for the special-area hatched overlay layer: cells that are special-use
// for the active layer. (Drawn above the main fill; visible only when toggled.)
function specialFilter(key) {
  const ek = emodeKeyFor(key);
  if (ek) return ["in", ["get", ek], ["literal", [2, 3]]];
  return ["==", ["to-number", ["get", SNAP.special_use_flag_key]], 1];
}

function setLayer(key) {
  CURRENT = key;
  const dens = isDensity(key);
  map.setPaintProperty(LAYER_ID, "fill-color", colorExpr(key));
  map.setPaintProperty(LAYER_ID, "fill-opacity", opacityExpr(key));
  map.setFilter(SPECIAL_LAYER_ID, specialFilter(key));
  applySpecialVisibility();
  // Force every already-rendered tile to re-evaluate the new fill expression now
  // (fast switches between the index ramp and the density ramp can otherwise leave
  // a stale-colored patch until the next interaction).
  if (map.style && map.isStyleLoaded()) map.triggerRepaint();

  // Legend: ramp style + tick endpoints (log-aware for density).
  const s = STATS[key];
  const bar = document.getElementById("legend-bar");
  bar.className = "bar " + (dens ? "density" : "index");
  if (dens) {
    bar.style.background = "";  // CSS class supplies the fixed density gradient
    document.getElementById("t-mid").textContent = fmt(s.p50, 0);
    document.getElementById("t-lo").textContent = fmt(s.p10, s.p10 < 1 ? 1 : 0);
    document.getElementById("t-hi").textContent = fmt(s.p99, 0);
    document.getElementById("legend-note").innerHTML =
      'Incidents per square mile (log scale). Green = low, red = hotspot. ' +
      '<span class="key nodata"></span> water-only (no data) ' +
      '<span class="key special"></span> special-use area.';
  } else {
    // The index colorway is the QUANTILE colorway: paint the legend bar with the
    // exact equal-count band colors so it matches the map. Bands are equal-width on
    // the bar (each holds ~the same number of cells) — the value ticks below show
    // the percentile breakpoints, so a steep stretch on the bar = a steep real-value
    // jump, which is the honest read of an equal-count scheme.
    const q = (s.q && s.q.length >= 2) ? s.q : [s.p01, 100, (s.p98 || s.p99 || 200)];
    const stops = buildQuantileStops(q);
    const n = stops.length;
    const segs = stops.map((st, i) => {
      const a = (i / n) * 100, b = ((i + 1) / n) * 100;
      return `${st[1]} ${a}%, ${st[1]} ${b}%`;
    });
    bar.style.background = `linear-gradient(90deg, ${segs.join(", ")})`;
    const top = q[q.length - 1];
    // Three ticks: low band edge, the band closest to 100 (national avg), and the
    // top "&ge;" anchor. Place "100" only if it falls inside the rendered range.
    document.getElementById("t-lo").textContent = fmt(q[0], q[0] < 10 ? 1 : 0);
    document.getElementById("t-mid").textContent =
      (q[0] <= 100 && top >= 100) ? "100" : fmt(s.p50, 0);
    document.getElementById("t-hi").textContent = "≥" + fmt(top, 0);
    document.getElementById("legend-note").innerHTML =
      'Index 100 = national average. Equal-count color bands (each holds the same ' +
      'share of block groups) so the full gradient shows everywhere; blue = below ' +
      'average, red = above. Top band is &ge;' + fmt(top, 0) + ' (extreme block ' +
      'groups land here instead of stretching the scale). ' +
      '<span class="key nodata"></span> no per-person rate ' +
      '<span class="key special"></span> special-use area.';
  }
  updateDisclaimer(key);
}

// Show / hide the hatched special-area overlay per the include toggle.
function applySpecialVisibility() {
  map.setLayoutProperty(SPECIAL_LAYER_ID, "visibility", INCLUDE_SU ? "visible" : "none");
}

function fmt(v, dp = 0) {
  if (v === null || v === undefined || v === "" || Number.isNaN(+v)) return null;
  return (+v).toLocaleString(undefined, { maximumFractionDigits: dp });
}

// Disclaimer caption: the active offense's methodology text, or the general note
// for aggregate layers (no single offense).
function updateDisclaimer(key) {
  const offense = SNAP.layer_offense[key];
  let text;
  if (offense && SNAP.disclaimers[offense]) {
    text = SNAP.disclaimers[offense].disclaimer;
  } else {
    text = SNAP.disclaimers.general.default_override_note;
  }
  const base = [
    "Jurisdiction totals come from official FBI and state reports for 2024.",
    "Inside about 30 large cities, the block-level pattern comes from the cities' own published incident data.",
    "Everywhere else, the block-level pattern is a statistical model based on housing, jobs, roads, and land use, then scaled to the official totals: the total is real, while neighborhood detail is modeled.",
    "Index 100 is the national average for the selected crime and measure.",
    "This covers reported crime only, and places differ in how crimes are reported.",
    "For person-exposure offenses, the exposure base uses residents/workers plus modeled daytime activity where larger.",
    "No public dataset provides tourist/visitor ambient population; visitor-heavy areas may still overstate per-person risk and are flagged."
  ].join(" ");
  let body = `${base} Special-area note: ${text}`;
  // Static layer-level note (e.g. murder/rape block-group reliability), carried
  // on the active layer's entry in SNAP.indices.
  const layerNote = defByKey(key) && defByKey(key).note;
  if (layerNote) body += ` ${layerNote}`;
  document.getElementById("disclaimer-body").textContent = body;
}

function popupHTML(p) {
  const labelByCol = {};
  SNAP.indices.forEach(i => (labelByCol[i.key] = i.label));
  const idxLabel = labelByCol[CURRENT] || CURRENT;
  const dens = isDensity(CURRENT);
  const su = isSpecialUse(p, CURRENT);
  const idxVal = p[CURRENT];
  const idxStr = (idxVal === undefined || idxVal === null) ? null : fmt(idxVal, dens ? 2 : 1);

  let head = `<div class="pp-name">${p.name || "Block group"}${p.st ? ", " + p.st : ""}</div>`;
  head += `<div class="pp-sub">${p.block_group_geoid || ""}${p.pop != null ? " &middot; pop " + fmt(p.pop) : ""}</div>`;

  // Special-use cells: a badge, then COUNT + DENSITY (which are valid) plus the
  // reason; the per-capita index is null by design and not shown as a headline.
  if (su) {
    head += `<div class="pp-badge">Special-use area</div>`;
    // Count + density (both valid here) for the active layer's offense; for an
    // aggregate/total layer use total density and sum the per-offense expected
    // counts (the tile has no single ec_total). The per-capita index is null by
    // design and never shown as a headline for these cells.
    const offense = SNAP.layer_offense[CURRENT];
    const sfx = offense ? offSuffix(offense) : null;
    let ec, dn;
    if (sfx) {
      ec = p["ec_" + sfx];
      dn = p["d_" + sfx];
    } else {
      dn = p[SNAP.density_total_key];
      let s = 0, any = false;
      SNAP.offenses.forEach(o => { const v = p["ec_" + o.key]; if (v != null && !Number.isNaN(+v)) { s += +v; any = true; } });
      ec = any ? s : null;
    }
    const ek = emodeKeyFor(CURRENT);
    const code = ek ? p[ek] : (+p[SNAP.special_use_flag_key] === 1 ? 2 : 0);
    const reason = SNAP.estimate_mode_labels[String(code)] || "special-use area";
    head += `<div class="pp-grid">`;
    head += `<div class="k">Why muted</div><div class="v">${reason}</div>`;
    const ecS = fmt(ec, 1);
    head += `<div class="k">Expected incidents${sfx ? "" : " (all)"}</div><div class="v">${ecS ? "~" + ecS : '<span class="pp-nd">-</span>'}</div>`;
    const dnS = fmt(dn, 2);
    head += `<div class="k">Density / sq mi</div><div class="v">${dnS ? dnS : '<span class="pp-nd">-</span>'}</div>`;
    head += `</div>`;
    head += `<div class="pp-foot">Per-person rate and index are not shown here because too few people live in this area for that rate to mean much. Use the count and density instead.</div>`;
    return head;
  }

  head += `<div class="pp-head"><span>${idxLabel}</span>` +
          (idxStr ? `<span class="v">${idxStr}${dens ? '<span style="font-size:11px;color:#8a93a6"> /mi&sup2;</span>' : ''}</span>` : `<span class="v pp-nd">no data</span>`) +
          `</div>`;

  // Incident-support line for index layers.
  if (!dens) {
    const rk = reliabilityKeyFor(CURRENT);
    if (rk) {
      const labels = SNAP.reliability_labels || {};
      const code = p[rk];
      const tier = (code != null && labels[String(code)]) ? labels[String(code)] : null;
      // The matching effective-support key (es_*) for the layer's offense, if any.
      const offense = SNAP.layer_offense[CURRENT];
      const sfx = offense ? offSuffix(offense) : "rob"; // aggregates proxy via robbery
      const sup = p["es_" + sfx];
      const supStr = fmt(sup, sup != null && +sup < 10 ? 1 : 0);
      if (tier) {
        const muted = tier === "low";
        const dot = muted ? "#8a93a6" : (tier === "high" ? "#6fcf97" : "#e0c879");
        head += `<div class="pp-grid" style="margin-bottom:6px">` +
          `<div class="k">Incident support</div>` +
          `<div class="v"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dot};vertical-align:0;margin-right:5px"></span>${tier}` +
          (supStr ? ` <span style="color:#7b8497">(~${supStr} incidents)</span>` : ` <span style="color:#7b8497">(modeled)</span>`) +
          `</div></div>`;
        if (muted) {
          head += `<div class="pp-note">Low incident support — modeled estimate; interpret block-level differences cautiously.</div>`;
        }
      }
    }
  }

  // Per-offense breakdown: primary index, primary rate, expected count, density.
  let rows = "";
  SNAP.offenses.forEach(o => {
    const ip = p["ip_" + o.key];   // primary index
    const r  = p["r_" + o.key];    // primary rate /100k
    const ec = p["ec_" + o.key];   // expected count
    if (ip === undefined && r === undefined && ec === undefined) return;
    const ipStr = fmt(ip, 1);
    const detail = [];
    const rStr = fmt(r, 1); if (rStr) detail.push(rStr + "/100k");
    const ecStr = fmt(ec, 1); if (ecStr) detail.push("~" + ecStr);
    rows += `<div class="k">${o.label}</div>` +
            `<div class="v">${ipStr ? ipStr : '<span class="pp-nd">-</span>'}` +
            (detail.length ? ` <span style="color:#7b8497">(${detail.join(", ")})</span>` : "") +
            `</div>`;
  });
  const grid = rows ? `<div class="pp-grid"><div class="k" style="color:#7b8497;grid-column:1/3;margin-bottom:2px">Offense index (rate, expected count)</div>${rows}</div>` : "";

  const foot = dens
    ? `<div class="pp-foot">Reported incidents per square mile. Shows concentration on the ground, not per-person risk.</div>`
    : `<div class="pp-foot">Index 100 = national average. Offense values use each crime's main risk index.</div>`;
  return head + grid + foot;
}

// offense long name -> short suffix used in tile keys (mvt, mur, ...).
function offSuffix(offense) {
  const m = {
    murder: "mur", rape: "rap", robbery: "rob", aggravated_assault: "agg",
    burglary: "bur", larceny: "lar", motor_vehicle_theft: "mvt",
  };
  return m[offense];
}

// ---- two-axis selector (crime type x measure) ----------------------------
// Current selection state. `measure` is one of the MEASURE_DEFS ids
// (primary/resident/density). `alt` (Total only) overrides with an aggregate-alt
// layer key when non-null.
let SEL = { crimeType: null, measure: null, alt: null };

function crimeTypeDef(id) { return SNAP.crime_types.find(c => c.id === id); }
function measureDef(id) { return SNAP.measures.find(m => m.id === id); }

// Populate the crime-type dropdown once; wire change handlers; set defaults.
function buildSelectors() {
  const cSel = document.getElementById("crime-sel");
  SNAP.crime_types.forEach(c => {
    const o = document.createElement("option");
    o.value = c.id; o.textContent = c.label;
    cSel.appendChild(o);
  });
  SEL.crimeType = SNAP.default_crime_type || SNAP.crime_types[0].id;
  SEL.measure = SNAP.default_measure || "primary";
  cSel.value = SEL.crimeType;

  cSel.addEventListener("change", () => {
    SEL.crimeType = cSel.value;
    SEL.alt = null;
    // Keep the chosen measure if the new crime type supports it, else fall back.
    const ct = crimeTypeDef(SEL.crimeType);
    if (!ct.measures[SEL.measure]) SEL.measure = "primary";
    refreshMeasureOptions();
    applySelection();
  });
  document.getElementById("measure-sel").addEventListener("change", () => {
    SEL.measure = document.getElementById("measure-sel").value;
    SEL.alt = null;
    document.getElementById("alt-sel").value = "";
    applySelection();
  });
  document.getElementById("alt-sel").addEventListener("change", () => {
    const v = document.getElementById("alt-sel").value;
    SEL.alt = v || null;
    applySelection();
  });

  refreshMeasureOptions();
  applySelection();
}

// Rebuild the MEASURE dropdown to only the measures the current crime type has,
// and show/populate the aggregate-alt sub-select for Total.
function refreshMeasureOptions() {
  const ct = crimeTypeDef(SEL.crimeType);
  const mSel = document.getElementById("measure-sel");
  mSel.innerHTML = "";
  SNAP.measures.forEach(m => {
    if (!ct.measures[m.id]) return;             // this crime type lacks this measure
    const o = document.createElement("option");
    o.value = m.id; o.textContent = m.label;
    mSel.appendChild(o);
  });
  if (!ct.measures[SEL.measure]) SEL.measure = mSel.options[0].value;
  mSel.value = SEL.measure;

  // Aggregate-alt sub-select (Total only).
  const altWrap = document.getElementById("alt-wrap");
  const altSel = document.getElementById("alt-sel");
  if (ct.alt && ct.alt.length) {
    altSel.innerHTML = '<option value="">Standard total selected</option>';
    ct.alt.forEach(a => {
      const o = document.createElement("option");
      o.value = a.key; o.textContent = a.label;
      altSel.appendChild(o);
    });
    altSel.value = SEL.alt || "";
    altWrap.style.display = "";
  } else {
    altWrap.style.display = "none";
    SEL.alt = null;
  }
}

// Resolve the current selection to a layer key and switch the map + explanation.
function applySelection() {
  const ct = crimeTypeDef(SEL.crimeType);
  let key, explainText;
  if (SEL.alt) {
    key = SEL.alt;
    const a = ct.alt.find(x => x.key === SEL.alt);
    explainText = `<b>${a.label}.</b> Alternative total view. Index 100 = national average.`;
  } else {
    key = ct.measures[SEL.measure];
    const m = measureDef(SEL.measure);
    // Total uses its own per-measure wording (aggregate, not a single offense).
    const txt = (SEL.crimeType === "total" && SNAP.total_measure_explain[SEL.measure])
      ? SNAP.total_measure_explain[SEL.measure]
      : m.explain;
    explainText = `<b>${ct.label} · ${m.label}.</b> ${txt}`;
  }
  document.getElementById("measure-explain").innerHTML = explainText;
  setLayer(key);
}

const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, maxWidth: "290px" });

async function init() {
  SNAP = await (await fetch("snapshot.json?" + Date.now())).json();
  STATS = SNAP.stats;
  document.getElementById("meta").textContent =
    `${SNAP.data_year} · 48 contiguous states + DC · block groups`;

  const suToggle = document.getElementById("su-toggle");
  suToggle.checked = INCLUDE_SU;
  suToggle.addEventListener("change", () => {
    INCLUDE_SU = suToggle.checked;
    applySpecialVisibility();
  });

  map.addSource(SOURCE, {
    type: "vector",
    url: "pmtiles://crimerisk_block_groups_2024.pmtiles",
    promoteId: "block_group_geoid",
  });
  map.addLayer({
    id: LAYER_ID,
    type: "fill",
    source: SOURCE,
    "source-layer": SNAP.tile_layer,
    paint: { "fill-color": "#3a4150", "fill-opacity": 0.78, "fill-outline-color": "rgba(0,0,0,0.12)" },
  });

  // Special-area overlay: a muted hatched fill drawn on top of the choropleth.
  // Hidden by default; the "Include special-use areas" toggle reveals it. The
  // hatch is faked with a fill-pattern image generated client-side so we avoid an
  // external sprite. Cells underneath are already greyed by the main layer.
  const hatch = makeHatchImage();
  map.addImage("su-hatch", hatch, { pixelRatio: 2 });
  map.addLayer({
    id: SPECIAL_LAYER_ID,
    type: "fill",
    source: SOURCE,
    "source-layer": SNAP.tile_layer,
    layout: { visibility: "none" },
    paint: { "fill-pattern": "su-hatch", "fill-opacity": 0.9 },
    filter: ["==", ["get", "block_group_geoid"], "__none__"],
  });

  // --- Water overlay (drawn ABOVE the choropleth) ---------------------------
  // The block-group geometry is full-resolution TIGER, which is NOT shoreline-
  // clipped: polygons extend to their legal boundary, which runs out into rivers
  // and harbors (Manhattan is the worst case — water on three sides). Rather than
  // clip every polygon to a coastline (fragile, heavy), we paint water on top so
  // any edge that bleeds into water is visually masked. Source: CARTO's free,
  // no-key OpenMapTiles-schema vector basemap; `water` (ocean/harbor/lake fills)
  // + `waterway` (river lines) match the dark theme and the raster basemap below.
  map.addSource("carto-vec", {
    type: "vector",
    tiles: [
      "https://tiles-a.basemaps.cartocdn.com/vectortiles/carto.streets/v1/{z}/{x}/{y}.mvt",
      "https://tiles-b.basemaps.cartocdn.com/vectortiles/carto.streets/v1/{z}/{x}/{y}.mvt",
      "https://tiles-c.basemaps.cartocdn.com/vectortiles/carto.streets/v1/{z}/{x}/{y}.mvt",
      "https://tiles-d.basemaps.cartocdn.com/vectortiles/carto.streets/v1/{z}/{x}/{y}.mvt",
    ],
    minzoom: 0,
    maxzoom: 14,
    attribution: ATTRIBUTION,
  });
  map.addLayer({
    id: "water-fill",
    type: "fill",
    source: "carto-vec",
    "source-layer": "water",
    filter: ["==", ["geometry-type"], "Polygon"],
    paint: { "fill-color": "#0c1118", "fill-opacity": 1, "fill-antialias": true },
  });
  map.addLayer({
    id: "waterway-line",
    type: "line",
    source: "carto-vec",
    "source-layer": "waterway",
    minzoom: 9,
    // Only mask genuine OPEN rivers/canals. Exclude buried/culverted channels
    // (brunnel=tunnel) and minor streams/drains/ditches — drawing dark lines for
    // those paints water across dry land (e.g. SF's culverted Islais/Mission
    // creeks). Wide tidal rivers (Harlem R.) are class=river and stay.
    filter: [
      "all",
      ["in", ["get", "class"], ["literal", ["river", "canal"]]],
      ["!=", ["get", "brunnel"], "tunnel"],
    ],
    paint: {
      "line-color": "#0c1118",
      "line-width": ["interpolate", ["linear"], ["zoom"], 9, 1, 12, 3, 15, 8],
    },
  });

  // --- Place-name labels (drawn ABOVE the choropleth) -----------------------
  // The basemap underneath is CARTO `dark_nolabels`, so without this overlay the
  // colored block groups float over an unlabeled void — you can't tell which city
  // or neighbourhood you're looking at. We add CARTO's matched `dark_only_labels`
  // raster overlay: the exact companion to the no-labels basemap, same dark
  // cartography, with city / town / neighbourhood / road names (and CARTO's own
  // built-in halos) baked into transparent PNG tiles. It carries its own zoom-
  // graded label density, so towns appear at metro zoom and neighbourhoods fill
  // in as you zoom. Drawn on TOP of the choropleth so names stay readable over
  // the colored block groups and the water mask.
  //
  // Why raster, not vector: the existing `carto-vec` (carto.streets/v1) source's
  // higher-zoom tiles fail to decode in MapLibre 4.7.1's tile worker ("type 4"
  // error), so its `place` layer is unusable for symbols. The raster label tiles
  // need no glyphs and no vector worker, so they render reliably at every zoom.
  // `@2x` retina tiles keep the text crisp on high-DPI displays.
  map.addSource("carto-labels", {
    type: "raster",
    tiles: [
      "https://basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}@2x.png",
    ],
    tileSize: 256,
    attribution: ATTRIBUTION,
  });
  map.addLayer({
    id: "place-labels",
    type: "raster",
    source: "carto-labels",
    paint: {
      // Slightly lifted so labels read clearly over saturated cells while not
      // fighting the choropleth; fade up from the low national zoom.
      "raster-opacity": ["interpolate", ["linear"], ["zoom"], 3, 0.82, 6, 0.95, 9, 1],
      "raster-resampling": "linear",
    },
  });

  // Build the two-axis selector now that the fill layers exist (buildSelectors ->
  // applySelection -> setLayer, which sets paint properties on LAYER_ID).
  buildSelectors();

  // Popup on hover for BOTH the choropleth and (when visible) the special layer.
  const showPopup = e => {
    if (!e.features.length) return;
    map.getCanvas().style.cursor = "pointer";
    const p = e.features[0].properties;
    popup.setLngLat(e.lngLat).setHTML(popupHTML(p)).addTo(map);
  };
  map.on("mousemove", LAYER_ID, showPopup);
  map.on("mousemove", SPECIAL_LAYER_ID, showPopup);
  map.on("mouseleave", LAYER_ID, () => { map.getCanvas().style.cursor = ""; popup.remove(); });
  map.on("mouseleave", SPECIAL_LAYER_ID, () => { map.getCanvas().style.cursor = ""; });
}

// Generate a small diagonal-hatch RGBA image for the special-area fill pattern.
function makeHatchImage() {
  const size = 8;
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "rgba(42,32,24,0.85)";   // muted brown base
  ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = "rgba(176,138,90,0.9)"; // tan diagonal lines
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-2, size + 2); ctx.lineTo(size + 2, -2);
  ctx.moveTo(-2, 2); ctx.lineTo(2, -2);
  ctx.moveTo(size - 2, size + 2); ctx.lineTo(size + 2, size - 2);
  ctx.stroke();
  return ctx.getImageData(0, 0, size, size);
}

let booted = false;
function boot() {
  if (booted) return;
  // Poll until the style spec is fully parsed before adding sources/layers.
  // We deliberately do NOT gate on the full `load`/idle event, which can stall
  // behind basemap raster tiles in restricted networks.
  if (!map.isStyleLoaded()) { setTimeout(boot, 60); return; }
  booted = true;
  init().catch(err => {
    document.getElementById("meta").textContent = "Error: " + err.message;
    console.error(err);
  });
}
boot();
</script>
</body>
</html>
